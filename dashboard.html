<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — H-VIEW</title>
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="H-VIEW" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#f5f3ed" />
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --white: #ffffff;
    --bg: #f5f3ed;
    --bg-alt: #ece8dc;
    --border: #d8d2c2;
    --border-strong: #c9c2ae;
    --text: #514a3b;
    --text-muted: #6b6350;
    --text-faint: #8c8266;
    --ink: #16140f;
    --purple: #6d3fae;
    --purple-dark: #5a2f96;
    --purple-tint: #f1e9f7;
    --green: #057a55;
    --green-tint: #e7f7f0;
    --amber: #b45309;
    --amber-tint: #fef3e2;
    --red: #c81e1e;
    --red-tint: #fdecec;
    --readout: #b8722a;
    --font-sans: "IBM Plex Sans", sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
  }
  body { font-family: var(--font-sans); background: var(--bg); color: var(--text); min-height: 100vh; }
  .mono { font-family: var(--font-mono); }

  nav {
    background: var(--white);
    border-bottom: 1px solid var(--border-strong);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; }
  .nav-right { display: flex; align-items: center; gap: 16px; }
  .user-name { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--text); }
  .device-select {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    background: var(--white);
    border: 1px solid var(--border-strong);
    padding: 6px 10px;
    cursor: pointer;
  }
  .btn-signout {
    padding: 8px 16px;
    border: 1px solid var(--border-strong);
    background: var(--white);
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    cursor: pointer;
    font-family: var(--font-mono);
  }
  .btn-signout:hover { background: var(--bg); }

  main { max-width: 1000px; margin: 0 auto; padding: 32px 24px 64px; }

  .status-banner {
    background: var(--white);
    border: 1px solid var(--border-strong);
    border-left: 6px solid var(--border-strong);
    padding: 24px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .status-banner.normal { border-left-color: var(--green); }
  .status-banner.warning { border-left-color: var(--amber); }
  .status-banner.critical { border-left-color: var(--red); }
  .status-banner.fault { border-left-color: var(--purple); }
  .status-banner.stale { border-left-color: var(--text-faint); }
  .status-left { display: flex; align-items: center; gap: 12px; }
  .status-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--border-strong); flex-shrink: 0; }
  .status-dot.normal { background: var(--green); animation: pulse 2s steps(1) infinite; }
  .status-dot.warning { background: var(--amber); animation: pulse 1.2s steps(1) infinite; }
  .status-dot.critical { background: var(--red); animation: pulse 0.6s steps(1) infinite; }
  .status-dot.fault { background: var(--purple); animation: pulse 0.9s steps(1) infinite; }
  .status-dot.stale { background: var(--text-faint); animation: pulse 1s steps(1) infinite; }
  .last-update.stale { color: var(--amber); font-weight: 600; }
  @keyframes pulse { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.2; } }
  .status-text { font-family: var(--font-mono); font-size: 24px; font-weight: 700; color: var(--ink); }
  .status-text.normal { color: var(--green); }
  .status-text.warning { color: var(--amber); }
  .status-text.critical { color: var(--red); }
  .status-text.fault { color: var(--purple); }
  .status-right { text-align: right; }
  .device-name { font-size: 14px; font-weight: 700; color: var(--ink); }
  .last-update { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-faint); margin-top: 4px; }

  .metric-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .metric-card { background: var(--white); border: 1px solid var(--border-strong); padding: 20px; }
  .metric-label { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); font-weight: 600; margin-bottom: 10px; }
  .metric-value { font-family: var(--font-mono); font-size: 26px; font-weight: 700; color: var(--readout); font-variant-numeric: tabular-nums; }
  .metric-unit { font-size: 13px; color: var(--text-faint); font-weight: 500; }
  .metric-baseline { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-faint); margin-top: 4px; }
  .metric-pill { display: inline-block; font-family: var(--font-mono); font-size: 11px; font-weight: 700; padding: 3px 9px; margin-top: 10px; text-transform: uppercase; letter-spacing: 0.03em; }
  .metric-pill.normal { background: var(--green-tint); color: var(--green); }
  .metric-pill.warning { background: var(--amber-tint); color: var(--amber); }
  .metric-pill.critical { background: var(--red-tint); color: var(--red); }
  .metric-pill.fault { background: var(--purple-tint); color: var(--purple); }
  .progress-track { height: 5px; background: var(--bg-alt); margin-top: 12px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green); transition: width 0.4s ease; }
  .progress-fill.warning { background: var(--amber); }
  .progress-fill.critical { background: var(--red); }
  .progress-fill.fault { background: var(--purple); }

  .panel { background: var(--white); border: 1px solid var(--border-strong); padding: 20px 24px; margin-bottom: 24px; }
  .panel-title { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.02em; }
  .chart-wrap { position: relative; }
  canvas { width: 100%; height: 120px; display: block; }
  .chart-sweep { position: absolute; top: 0; bottom: 0; width: 1.5px; background: var(--readout); pointer-events: none; animation: sweep 4s linear infinite; }
  @keyframes sweep { from { left: 0%; } to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) {
    .status-dot, .chart-sweep { animation: none; }
  }

  .log-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .btn-clear { border: none; background: none; color: var(--purple); font-family: var(--font-mono); font-size: 12px; font-weight: 600; text-transform: uppercase; cursor: pointer; }
  .log-list { max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .log-item { display: flex; align-items: baseline; gap: 10px; font-size: 13px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); }
  .log-item .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .log-item .dot.normal { background: var(--green); }
  .log-item .dot.warning { background: var(--amber); }
  .log-item .dot.critical { background: var(--red); }
  .log-item .dot.fault { background: var(--purple); }
  .log-time { color: var(--text-faint); font-family: var(--font-mono); font-size: 11px; }
  .empty { color: var(--text-faint); font-size: 13px; padding: 8px; }
</style>
</head>
<body>

<nav>
  <div class="brand"><img src="assets/logo-lockup.png" alt="H-VIEW" style="height:26px; width:auto; display:block;" /></div>
  <div class="nav-right">
    <select class="device-select" id="deviceSelect" style="display:none;"></select>
    <span class="user-name" id="userName"></span>
    <button class="btn-signout" id="signOutBtn">Sign out</button>
  </div>
</nav>

<main>
  <div class="status-banner" id="statusBanner">
    <div class="status-left">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">Waiting for data...</span>
    </div>
    <div class="status-right">
      <div class="device-name" id="deviceName">—</div>
      <div class="last-update" id="lastUpdate">No readings yet</div>
    </div>
  </div>

  <div class="metric-row">
    <div class="metric-card">
      <div class="metric-label">Accel magnitude</div>
      <div class="metric-value"><span id="accelValue">—</span> <span class="metric-unit">g</span></div>
      <div class="metric-baseline" id="accelBaseline">Baseline not calibrated</div>
      <span class="metric-pill normal" id="accelPill">—</span>
      <div class="progress-track"><div class="progress-fill" id="accelBar" style="width:0%"></div></div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Gyro magnitude</div>
      <div class="metric-value"><span id="gyroValue">—</span> <span class="metric-unit">&deg;/s</span></div>
      <div class="metric-baseline" id="gyroBaseline">Baseline not calibrated</div>
      <span class="metric-pill normal" id="gyroPill">—</span>
      <div class="progress-track"><div class="progress-fill" id="gyroBar" style="width:0%"></div></div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Temperature</div>
      <div class="metric-value"><span id="tempValue">—</span> <span class="metric-unit">&deg;F</span></div>
      <div class="metric-baseline" id="readingCount">0 total readings</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Vibration history</div>
    <div class="chart-wrap">
      <canvas id="chart" width="900" height="120"></canvas>
      <div class="chart-sweep"></div>
    </div>
  </div>

  <div class="panel">
    <div class="log-header">
      <div class="panel-title" style="margin-bottom:0;">Event log</div>
      <button class="btn-clear" id="clearLogBtn">Clear</button>
    </div>
    <div class="log-list" id="logList">
      <div class="empty">No events yet.</div>
    </div>
  </div>
</main>

<script>
  const statusBanner = document.getElementById('statusBanner');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const deviceNameEl = document.getElementById('deviceName');
  const lastUpdateEl = document.getElementById('lastUpdate');
  const logList = document.getElementById('logList');
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const deviceSelect = document.getElementById('deviceSelect');

  // Per-device chart history, last-logged-status, and reading count -- a
  // client can now have more than one assigned device, so this state can't
  // be one set of module-level variables shared across all of them.
  const deviceState = new Map(); // deviceId -> { history, lastLoggedStatus, readingCount }
  let selectedDeviceId = null;
  let polling = false;
  let consecutiveFailures = 0;
  let lastSuccessAt = null;
  const STALE_THRESHOLD = 3;

  // A fetch error previously only went to console.error, leaving the UI
  // showing stale "last known good" status indefinitely during an outage
  // with no visible indication anything was wrong.
  function markStale() {
    statusBanner.classList.add('stale');
    statusDot.classList.add('stale');
    lastUpdateEl.classList.add('stale');
    const secs = lastSuccessAt ? Math.round((Date.now() - lastSuccessAt) / 1000) : null;
    lastUpdateEl.textContent = secs !== null ? `Stale — last updated ${secs}s ago` : 'Stale — no successful update yet';
  }

  function clearStale() {
    statusBanner.classList.remove('stale');
    statusDot.classList.remove('stale');
    lastUpdateEl.classList.remove('stale');
  }

  function stateFor(deviceId) {
    if (!deviceState.has(deviceId)) {
      deviceState.set(deviceId, { history: [], lastLoggedStatus: null, readingCount: 0 });
    }
    return deviceState.get(deviceId);
  }

  function statusClass(status) {
    if (status === 'NORMAL') return 'normal';
    if (status === 'WARNING') return 'warning';
    if (status === 'CRITICAL') return 'critical';
    if (status === 'SENSOR_FAULT') return 'fault';
    return '';
  }

  // Guards against malformed/non-numeric values reaching .toFixed() -- the
  // backend now rejects non-finite numbers at write time (data.js), but a
  // frontend guard is cheap insurance against a bug anywhere else in the
  // path, or old data from before that validation existed.
  function isFiniteNumber(v) {
    return typeof v === 'number' && Number.isFinite(v);
  }

  function fmtSigma(sigma) {
    if (!isFiniteNumber(sigma)) return '';
    return `${sigma.toFixed(1)}σ from baseline`;
  }

  function updateMetricCard(prefix, value, baseMean, baseStd, sigma, status, unit) {
    const valueEl = document.getElementById(`${prefix}Value`);
    const baselineEl = document.getElementById(`${prefix}Baseline`);
    const pillEl = document.getElementById(`${prefix}Pill`);
    const barEl = document.getElementById(`${prefix}Bar`);
    const cls = statusClass(status);

    valueEl.textContent = isFiniteNumber(value) ? value.toFixed(3) : '—';
    if (isFiniteNumber(baseMean)) {
      const stdPart = isFiniteNumber(baseStd) ? baseStd.toFixed(3) : '0.000';
      baselineEl.textContent = `Baseline ${baseMean.toFixed(3)} ± ${stdPart} ${fmtSigma(sigma) ? '· ' + fmtSigma(sigma) : ''}`;
    } else {
      baselineEl.textContent = 'Baseline not calibrated';
    }
    pillEl.textContent = status || '—';
    pillEl.className = `metric-pill ${cls}`;
    const pct = Math.min(100, Math.abs(isFiniteNumber(sigma) ? sigma : 0) * 25);
    barEl.style.width = `${pct}%`;
    barEl.className = `progress-fill ${cls}`;
  }

  function logEvent(status, message) {
    const empty = logList.querySelector('.empty');
    if (empty) empty.remove();
    const item = document.createElement('div');
    item.className = 'log-item';
    const dot = document.createElement('span');
    dot.className = `dot ${statusClass(status)}`;
    const msgEl = document.createElement('span');
    msgEl.textContent = message;
    const timeEl = document.createElement('span');
    timeEl.className = 'log-time';
    timeEl.textContent = new Date().toLocaleTimeString();
    item.append(dot, msgEl, timeEl);
    logList.prepend(item);
  }

  function drawChart(history) {
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = '#f0eef8';
    ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      const y = (h / 4) * i;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    if (history.length < 2) return;

    const drawLine = (key, color) => {
      const values = history.map(p => p[key] || 0);
      const max = Math.max(...values, 0.01);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      values.forEach((v, i) => {
        const x = (i / (values.length - 1)) * w;
        const y = h - (v / max) * (h - 10) - 5;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      });
      ctx.stroke();
    };
    drawLine('accel', '#6d3fae');
    drawLine('gyro', '#a370d9');
  }

  function renderDeviceSelect(devices) {
    if (devices.length <= 1) {
      deviceSelect.style.display = 'none';
      return;
    }
    deviceSelect.style.display = '';
    const currentOptionIds = Array.from(deviceSelect.options).map(o => o.value);
    const deviceIds = devices.map(d => d.id);
    if (currentOptionIds.join(',') !== deviceIds.join(',')) {
      deviceSelect.textContent = '';
      devices.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.id;
        opt.textContent = d.deviceName || d.id;
        deviceSelect.appendChild(opt);
      });
    }
    deviceSelect.value = selectedDeviceId;
  }

  // Tracks reading count / chart history / status-change logging for one
  // device. Runs for every device on every poll, regardless of which one is
  // currently selected -- a status change on a device you're not looking at
  // right now should still show up in the log, not go unnoticed until you
  // happen to switch to it.
  function updateDeviceState(d, multiDevice) {
    if (!d || !d.status) return;
    const state = stateFor(d.id);
    state.readingCount += 1;
    state.history.push({ accel: d.accel, gyro: d.gyro });
    if (state.history.length > 80) state.history.shift();

    if (d.status !== state.lastLoggedStatus) {
      const label = multiDevice ? `${d.deviceName || d.id}: status changed to ${d.status}` : `Status changed to ${d.status}`;
      logEvent(d.status, label);
      state.lastLoggedStatus = d.status;
    }
  }

  // Pure DOM rendering for whichever device is currently selected -- reads
  // from state (already updated by updateDeviceState above), doesn't mutate it.
  function renderDevice(d) {
    if (!d || !d.status) {
      statusText.textContent = 'Waiting for data...';
      statusBanner.className = 'status-banner';
      statusDot.className = 'status-dot';
      deviceNameEl.textContent = (d && d.deviceName) || '—';
      lastUpdateEl.textContent = 'No readings yet';
      return;
    }

    const cls = statusClass(d.status);
    statusText.textContent = d.status;
    statusText.className = `status-text ${cls}`;
    statusBanner.className = `status-banner ${cls}`;
    statusDot.className = `status-dot ${cls}`;
    deviceNameEl.textContent = d.deviceName || '—';
    lastUpdateEl.textContent = d.receivedAt ? `Updated ${new Date(d.receivedAt).toLocaleTimeString()}` : 'Just now';

    updateMetricCard('accel', d.accel, d.accelBaseMean, d.accelBaseStd, d.accelSigma, d.status);
    updateMetricCard('gyro', d.gyro, d.gyroBaseMean, d.gyroBaseStd, d.gyroSigma, d.status);
    document.getElementById('tempValue').textContent = isFiniteNumber(d.temp) ? d.temp.toFixed(1) : '—';

    const state = stateFor(d.id);
    document.getElementById('readingCount').textContent = `${state.readingCount} readings this session`;
    drawChart(state.history);
  }

  async function poll() {
    if (polling) return;
    polling = true;
    try {
      const res = await fetch('/api/latest');
      if (res.status === 401) { window.location.href = '/login'; return; }
      if (!res.ok) throw new Error(`latest returned ${res.status}`);
      const data = await res.json();
      const devices = data.devices || [];

      consecutiveFailures = 0;
      lastSuccessAt = Date.now();
      clearStale();

      if (devices.length === 0) {
        renderDeviceSelect([]);
        renderDevice(null);
        return;
      }

      if (!selectedDeviceId || !devices.some(d => d.id === selectedDeviceId)) {
        selectedDeviceId = devices[0].id;
      }
      renderDeviceSelect(devices);

      const multiDevice = devices.length > 1;
      devices.forEach(d => updateDeviceState(d, multiDevice));

      const selected = devices.find(d => d.id === selectedDeviceId);
      renderDevice(selected);
    } catch (err) {
      console.error(err);
      consecutiveFailures += 1;
      if (consecutiveFailures >= STALE_THRESHOLD) markStale();
    } finally {
      polling = false;
    }
  }

  // The event log stays a single shared list across all devices (each entry
  // names its device when there's more than one) rather than being wiped
  // per-device on switch -- simpler, and nothing about "what happened
  // recently" should disappear just because you're looking at a different
  // device's chart right now. Only the chart itself is genuinely per-device.
  deviceSelect.addEventListener('change', () => {
    selectedDeviceId = deviceSelect.value;
    drawChart(stateFor(selectedDeviceId).history);
  });

  document.getElementById('clearLogBtn').addEventListener('click', () => {
    logList.innerHTML = '<div class="empty">No events yet.</div>';
  });

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/login';
  });

  (async function init() {
    try {
      const res = await fetch('/api/me');
      if (!res.ok) { window.location.href = '/login'; return; }
      const me = await res.json();
      if (me.role === 'admin') { window.location.href = '/admin'; return; }
      document.getElementById('userName').textContent = me.name || me.email;
    } catch (err) {
      window.location.href = '/login';
      return;
    }
    poll();
    setInterval(poll, 500);
  })();
</script>
</body>
</html>
