<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — H-VIEW</title>
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="H-VIEW" />
<meta name="theme-color" content="#f6f3ed" />
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --white: #ffffff;
    --cream: #f6f3ed;
    --grey-200: #e4e4e7;
    --grey-300: #d4d4d8;
    --grey-500: #7c7488;
    --grey-700: #453d56;
    --grey-900: #241c3f;
    --blue: #6a63e0;
    --blue-dark: #554cc9;
    --blue-tint: #ecebfc;
    --red: #c81e1e;
    --red-tint: #fdecec;
  }
  body {
    font-family: "Inter", sans-serif;
    background: var(--cream);
    color: var(--grey-700);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--white);
    border: 1px solid var(--grey-200);
    border-radius: 16px;
    box-shadow: 0 4px 12px rgba(24,24,27,0.05), 0 16px 40px rgba(24,24,27,0.08);
    padding: 40px;
    width: 100%;
    max-width: 400px;
  }
  .brand { display: flex; align-items: center; margin-bottom: 6px; }
  .tagline { font-size: 13.5px; color: var(--grey-500); margin-bottom: 32px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--grey-700); margin-bottom: 6px; }
  .field { margin-bottom: 18px; }
  input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--grey-300);
    border-radius: 8px;
    font-size: 14.5px;
    font-family: inherit;
    color: var(--grey-900);
  }
  input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(106,99,224,0.15); }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--blue);
    color: white;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
    margin-top: 6px;
  }
  button:hover { background: var(--blue-dark); }
  button:disabled { opacity: 0.6; cursor: default; }
  .error {
    display: none;
    background: var(--red-tint);
    color: var(--red);
    font-size: 13.5px;
    font-weight: 500;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 18px;
  }
  .error.show { display: block; }
  footer { text-align: center; font-size: 12.5px; color: var(--grey-500); margin-top: 24px; }
</style>
</head>
<body>

<div>
  <div class="card">
    <div class="brand">
      <img src="assets/logo-lockup.png" alt="H-VIEW" style="height:34px; width:auto;" />
    </div>
    <div class="tagline">Device health monitoring platform</div>

    <div class="error" id="error"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" id="submitBtn">Sign in</button>
    </form>
  </div>
  <footer>H-VIEW &middot; Predictive Maintenance</footer>
</div>

<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('error');
  const submitBtn = document.getElementById('submitBtn');

  function redirectFor(role) {
    window.location.href = role === 'admin' ? '/admin' : '/dashboard';
  }

  fetch('/api/me').then(r => {
    if (r.ok) return r.json();
    return null;
  }).then(data => {
    if (data && data.role) redirectFor(data.role);
  }).catch(() => {});

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');
      redirectFor(data.role);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
