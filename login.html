<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — H-VIEW</title>
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="H-VIEW" />
<meta name="theme-color" content="#f5f3ed" />
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --white: #ffffff;
    --bg: #f5f3ed;
    --ink: #16140f;
    --text: #514a3b;
    --text-muted: #6b6350;
    --text-faint: #8c8266;
    --border: #d8d2c2;
    --border-strong: #c9c2ae;
    --purple: #6d3fae;
    --purple-dark: #5a2f96;
    --purple-tint: #f1e9f7;
    --red: #c81e1e;
    --red-tint: #fdecec;
    --font-sans: "IBM Plex Sans", sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--white);
    border: 1px solid var(--border-strong);
    box-shadow: 0 4px 12px rgba(22,20,15,0.04), 0 16px 32px rgba(22,20,15,0.06);
    padding: 40px;
    width: 100%;
    max-width: 400px;
  }
  .brand { display: flex; align-items: center; margin-bottom: 6px; }
  .tagline { font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); margin-bottom: 32px; letter-spacing: 0.02em; }
  label { display: block; font-family: var(--font-mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin-bottom: 7px; }
  .field { margin-bottom: 18px; }
  input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border-strong);
    font-size: 14px;
    font-family: var(--font-mono);
    color: var(--ink);
    background: var(--white);
  }
  input:focus { outline: none; border-color: var(--purple); box-shadow: 0 0 0 3px rgba(109,63,174,0.15); }
  button {
    width: 100%;
    padding: 13px;
    border: none;
    background: var(--purple);
    color: white;
    font-weight: 600;
    font-size: 13px;
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    cursor: pointer;
    margin-top: 6px;
  }
  button:hover { background: var(--purple-dark); }
  button:disabled { opacity: 0.6; cursor: default; }
  .error {
    display: none;
    background: var(--red-tint);
    color: var(--red);
    font-size: 13px;
    font-weight: 500;
    padding: 10px 12px;
    margin-bottom: 18px;
    border: 1px solid var(--red);
  }
  .error.show { display: block; }
  footer { text-align: center; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-top: 24px; letter-spacing: 0.02em; }
</style>
</head>
<body>

<div>
  <div class="card">
    <div class="brand">
      <img src="assets/logo-lockup.png" alt="H-VIEW" style="height:34px; width:auto;" />
    </div>
    <div class="tagline">DEVICE HEALTH MONITORING PLATFORM</div>

    <div class="error" id="error"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" id="submitBtn">Sign in &#8594;</button>
    </form>
  </div>
  <footer>H-VIEW &middot; PREDICTIVE MAINTENANCE</footer>
</div>

<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('error');
  const submitBtn = document.getElementById('submitBtn');

  function redirectFor(role) {
    window.location.href = role === 'admin' ? '/admin' : '/dashboard';
  }

  fetch('/api/me').then(r => {
    if (r.ok) return r.json();
    return null;
  }).then(data => {
    if (data && data.role) redirectFor(data.role);
  }).catch(() => {});

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');
      redirectFor(data.role);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in →';
    }
  });
</script>
</body>
</html>
