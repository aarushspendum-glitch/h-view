<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set your password — H-VIEW</title>
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="H-VIEW" />
<meta name="theme-color" content="#f6f3ed" />
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --white: #ffffff;
    --cream: #f6f3ed;
    --grey-200: #e4e4e7;
    --grey-300: #d4d4d8;
    --grey-500: #7c7488;
    --grey-700: #453d56;
    --grey-900: #241c3f;
    --blue: #6a63e0;
    --blue-dark: #554cc9;
    --blue-tint: #ecebfc;
    --red: #c81e1e;
    --red-tint: #fdecec;
    --green: #057a55;
    --green-tint: #e7f7f0;
  }
  body {
    font-family: "Inter", sans-serif;
    background: var(--cream);
    color: var(--grey-700);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--white);
    border: 1px solid var(--grey-200);
    border-radius: 16px;
    box-shadow: 0 4px 12px rgba(24,24,27,0.05), 0 16px 40px rgba(24,24,27,0.08);
    padding: 40px;
    width: 100%;
    max-width: 400px;
  }
  .brand { display: flex; align-items: center; margin-bottom: 6px; }
  .tagline { font-size: 13.5px; color: var(--grey-500); margin-bottom: 32px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--grey-700); margin-bottom: 6px; }
  .field { margin-bottom: 18px; }
  input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--grey-300);
    border-radius: 8px;
    font-size: 14.5px;
    font-family: inherit;
    color: var(--grey-900);
  }
  input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(106,99,224,0.15); }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--blue);
    color: white;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
    margin-top: 6px;
  }
  button:hover { background: var(--blue-dark); }
  button:disabled { opacity: 0.6; cursor: default; }
  .msg {
    display: none;
    font-size: 13.5px;
    font-weight: 500;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 18px;
  }
  .msg.error { background: var(--red-tint); color: var(--red); }
  .msg.success { background: var(--green-tint); color: var(--green); }
  .msg.show { display: block; }
  .hint { font-size: 12.5px; color: var(--grey-500); margin-top: 6px; }
  footer { text-align: center; font-size: 12.5px; color: var(--grey-500); margin-top: 24px; }
</style>
</head>
<body>

<div>
  <div class="card" id="card">
    <div class="brand">
      <img src="assets/logo-lockup.png" alt="H-VIEW" style="height:34px; width:auto;" />
    </div>
    <div class="tagline">Set up your account</div>

    <div class="msg" id="msg"></div>

    <form id="setForm">
      <div class="field">
        <label for="password">Choose a password</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" />
        <div class="hint">At least 8 characters.</div>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" name="confirm" required minlength="8" autocomplete="new-password" />
      </div>
      <button type="submit" id="submitBtn">Set password &amp; continue</button>
    </form>
  </div>
  <footer>H-VIEW &middot; Predictive Maintenance</footer>
</div>

<script>
  const form = document.getElementById('setForm');
  const msgBox = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');
  const token = new URLSearchParams(window.location.search).get('token');

  function showMsg(text, type) {
    msgBox.textContent = text;
    msgBox.className = `msg show ${type}`;
  }

  if (!token) {
    showMsg('This link is missing a setup token. Check the link from your email.', 'error');
    form.style.display = 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    if (password !== confirm) {
      showMsg("Passwords don't match.", 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Setting password...';

    try {
      const res = await fetch('/api/set-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to set password');

      showMsg('Password set! Redirecting to your dashboard...', 'success');
      setTimeout(() => {
        window.location.href = data.role === 'admin' ? '/admin' : '/dashboard';
      }, 1200);
    } catch (err) {
      showMsg(err.message, 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Set password & continue';
    }
  });
</script>
</body>
</html>
